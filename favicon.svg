<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#050506"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#d4af37" stroke-width="8" opacity="0.4"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#cca43b" stroke-width="3" opacity="0.8"/>
  <g transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- High-Contrast Monogram GT -->
    <text x="256" y="295" 
          font-family="'Cinzel', 'Cinzel Decorative', 'Georgia', serif" 
          font-size="210" 
          font-weight="700" 
          fill="url(#goldGradient)" 

    .nav-link { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: #5c4a32; text-decoration: none; padding: 6px 14px; border: 1px solid rgba(42,35,24,0.2); border-radius: 4px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }

      text-align: center;
      margin: 24px 0 28px;

    .middle-quote::before,
    .middle-quote::after {
      content: '';
      position: absolute; left: 50%; transform: translateX(-50%);
      height: 1px; background: linear-gradient(90deg, transparent, rgba(92,74,50,0.35), transparent);
    }
    .middle-quote::before { top: 0; width: 80%; }
    .middle-quote::after { bottom: 0; width: 80%; }

    .middle-quote .quote-text {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 600;
      color: #5c4a32;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }
    .middle-quote .quote-text .highlight {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: #2a2318;
      font-size: 0.95em;
    }
    .middle-quote .quote-author {
      font-family: 'Cinzel', serif;

      text-transform: uppercase;

      display: block;

    .form-group { margin-bottom: 0.85rem; opacity: 0; animation: slideUp 0.5s ease forwards; }
    .form-group:nth-child(1) { animation-delay: 0.6s; }

<body>

  <div class="ink-splash"></div>
  <div class="ink-splash-2"></div>

  <header class="header">
    <a href="menu.html" class="logo">Ganesh Tajane</a>
    <div class="nav-links">
      <a href="explore.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">
        Menu
        <div class="nav-ham"><span></span><span></span></div>
      </a>
    </div>
  </header>

  <main class="page-content">
    <div class="write-container">

      <div class="section-subtitle">Direct Connection</div>
      <h1 class="section-title">Write to Me</h1>
      <div class="divider"></div>

      <form id="whatsappForm">

        <div class="form-group">
          <label for="writeName">Full Name</label>
          <input type="text" id="writeName" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
          <label for="writeAddress">City &amp; Country</label>
          <input type="text" id="writeAddress" required placeholder="e.g. Mumbai, India">
        </div>

        <div class="form-group">
          <label for="writeTopic">I am writing regarding</label>
          <div class="select-wrapper">
            <select id="writeTopic" required>
              <option value="" disabled selected>Select a topic</option>
              <option value="Chess">Chess</option>
              <option value="Spirituality">Spirituality</option>
              <option value="Temple Vision">Temple Vision</option>
              <option value="Book">Book</option>
              <option value="Personal">Personal</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="writeMsg">Your Message</label>
          <textarea id="writeMsg" rows="3" required placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit" class="whatsapp-btn">
          <img src="asset/whtasapp%20logo.png" alt="WhatsApp" class="whatsapp-icon">
          Connect on WhatsApp
        </button>
      </form>

      <p class="personal-note">I personally read as many messages as possible</p>

      <div class="traveller-quote"><span class="drop-cap">E</span>very traveller carries a story,<br>you are welcome to share yours.</div>

    </div>
  </main>

  <script>
    document.getElementById('whatsappForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name    = document.getElementById('writeName').value.trim();
      const address = document.getElementById('writeAddress').value.trim();
      const topic   = document.getElementById('writeTopic').value.trim();
      const msg     = document.getElementById('writeMsg').value.trim();

      const formattedText =
        `Name: ${name}\nCity & Country: ${address}\nRegarding: ${topic}\nMessage: ${msg}`;
      const encodedText = encodeURIComponent(formattedText);
      const whatsappUrl = `https://wa.me/919767728581?text=${encodedText}`;

      window.open(whatsappUrl, '_blank');
    });
  </script>
  <script>
    // Prevent browser zoom (pinch-to-zoom and keyboard/mousewheel shortcuts)
    (function() {
      // Prevent pinch-to-zoom on touch devices
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap to zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = new Date().getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent Ctrl + Plus / Ctrl + Minus / Ctrl + 0 keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '+' || e.key === '0' || e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.keyCode === 96)) {
          e.preventDefault();
        }
      });

      // Prevent Ctrl + Mouse Wheel zoom
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>

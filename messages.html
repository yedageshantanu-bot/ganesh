  <style>

  <main class="page-content">

    <h1 class="section-title">Messages from Fellow Travelers</h1>
    <div class="section-quote-wrapper" id="quoteWrapper">
      <span class="section-quote-line line-primary">"Every message carries a story,</span>
      <span class="section-quote-line line-secondary">Every story carries a world."</span>

    <div class="view-toggle">
      <button class="toggle-btn active" id="btnShowMessages">Read Reflections</button>

    <div class="messages-section active" id="messagesSection">

          <input type="text" id="travelerLocation" placeholder="e.g. Mumbai, India">
        </div>
        <div class="form-group">
          <label for="travelerMessage">Your Experience / Reflection</label>
          <textarea id="travelerMessage" rows="5" required placeholder="Share your experience..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Leave a Reflection</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ifssqkfmymcjfquqfrmw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmc3Nxa2ZteW1jamZxdXFmcm13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mzc2NjMsImV4cCI6MjA5NzExMzY2M30.GzeyXgI20coRpEdChVe9YV4a3VZNknqHwjcH4BBKans';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    const btnShowMessages = document.getElementById('btnShowMessages');
    const btnTellExperience = document.getElementById('btnTellExperience');
    const messagesSection = document.getElementById('messagesSection');
    const formSection = document.getElementById('formSection');

    btnShowMessages.addEventListener('click', () => {
      btnShowMessages.classList.add('active');
      btnTellExperience.classList.remove('active');
      messagesSection.classList.add('active');
      formSection.classList.remove('active');
      loadMessages();
    });

    btnTellExperience.addEventListener('click', () => {
      btnTellExperience.classList.add('active');
      btnShowMessages.classList.remove('active');
      formSection.classList.add('active');
      messagesSection.classList.remove('active');
    });

    // Local storage key for reflections sync & offline backup
    const LOCAL_KEY = 'gt_local_reflections';

    function getLocalReflections() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLocalReflection(item) {
      const current = getLocalReflections();
      current.unshift(item);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(current));
    }

    const defaultReflections = [
      {
        id: 'def_1',
        full_name: 'Aarav Sharma',
        city_country: 'Pune, India',
        created_at: new Date(Date.now() - 86400000 * 2).toISOString(),
        approved: true,
        message: 'Reading about the journey of Vayu Mahesh deeply inspired me. It reminded me that purpose isn\'t found overnight, but built with quiet discipline day by day.'
      },
      {
        id: 'def_2',
        full_name: 'Elena Rostova',
        city_country: 'Prague, Czech Republic',
        created_at: new Date(Date.now() - 86400000 * 5).toISOString(),
        approved: true,
        message: 'The stillness in these writings is palpable. A rare space on the internet to pause, breathe, and reflect on what truly matters.'
      },
      {
        id: 'def_3',
        full_name: 'Rohan Deshmukh',
        city_country: 'Nashik, India',
        created_at: new Date(Date.now() - 86400000 * 8).toISOString(),
        approved: true,
        message: 'From the sixty-four squares of chess to the path of devotion, your story resonates with anyone striving for higher focus.'
      }
    ];

    async function loadMessages() {
      const list = document.getElementById('messagesList');
      list.innerHTML = '<div class="loading-spinner">Seeking reflections...</div>';

      let apiApprovedMessages = [];

      // 1. Fetch approved messages from local server API
      try {
        const res = await fetch('/api/messages');
        if (res.ok) {
          apiApprovedMessages = await res.json();
        }
      } catch (err) {
        console.warn('API fetch notice:', err);
      }

      // 2. Fetch approved messages from Supabase (if available)
      let dbMessages = [];
      try {
        const { data, error } = await supabaseClient
          .from('traveler_messages')
          .select('*')
          .eq('approved', true)
          .order('created_at', { ascending: false });

        if (!error && data) {
          dbMessages = data;
        }
      } catch (err) {
        console.warn('Supabase fetch notice:', err);
      }

      // Combine approved API messages and DB approved messages
      const combined = [...apiApprovedMessages, ...dbMessages];
      
      const uniqueMap = new Map();
      combined.forEach(m => {
        if (m && m.approved === true) {
          const key = m.id || (m.full_name + m.message);
          if (!uniqueMap.has(key)) uniqueMap.set(key, m);
        }
      });
      const finalMessages = Array.from(uniqueMap.values());
      const displayList = finalMessages.length > 0 ? finalMessages : defaultReflections;

      list.innerHTML = '';
      displayList.forEach((msg, i) => {
        const date = msg.created_at ? new Date(msg.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Recently';
        const metaParts = [];
        if (msg.city_country) metaParts.push(msg.city_country);
        metaParts.push(date);
        const metaInfo = metaParts.join(' \u2022 ');

        const card = document.createElement('div');
        card.className = 'message-card';
        card.style.animationDelay = (i * 0.08) + 's';
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="traveler-name">${escapeHTML(msg.full_name)}</div>
              <div class="traveler-meta">${escapeHTML(metaInfo)}</div>
            </div>
          </div>
          <p class="traveler-text">"${escapeHTML(msg.message)}"</p>
        `;
        list.appendChild(card);
      });
    }

    document.getElementById('travelersForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('travelerName').value.trim();
      const location = document.getElementById('travelerLocation').value.trim();
      const message = document.getElementById('travelerMessage').value.trim();

      const form = e.target;
      const existingStatus = form.querySelector('.form-status');
      if (existingStatus) existingStatus.remove();

      const statusMsg = document.createElement('div');
      statusMsg.className = 'form-status';
      form.appendChild(statusMsg);

      // 1. Submit reflection to server API (saved as approved: false - pending admin approval)
      try {
        await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name: name, city_country: location || null, message: message })
        });
      } catch (err) {
        console.warn('API insert notice:', err);
      }

      // 2. Sync to Supabase with approved: false (if available)
      try {
        await supabaseClient
          .from('traveler_messages')
          .insert([{ full_name: name, city_country: location || null, message: message, approved: false }]);
      } catch (err) {
        console.warn('Supabase insert notice:', err);
      }

      statusMsg.className = 'form-status success';
      statusMsg.textContent = 'Your reflection has been submitted! It will appear on the site once approved by the admin. 🙏';
      form.reset();
    });

    loadMessages();

    const quoteWrapper = document.getElementById('quoteWrapper');
    const quoteObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          quoteObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    quoteObserver.observe(quoteWrapper);
  </script>
  <script>
    // Prevent browser zoom (pinch-to-zoom and keyboard/mousewheel shortcuts)
    (function() {
      // Prevent pinch-to-zoom on touch devices
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap to zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = new Date().getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent Ctrl + Plus / Ctrl + Minus / Ctrl + 0 keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '+' || e.key === '0' || e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.keyCode === 96)) {
          e.preventDefault();
        }
      });

      // Prevent Ctrl + Mouse Wheel zoom
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>

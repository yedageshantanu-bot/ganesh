<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connect - Ganesh Tajane World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { display: none; }

    body { min-height: 100vh; background: #d8cfb8; font-family: 'Inter', sans-serif; color: #2a2318; overflow-x: hidden; position: relative; }

    /* Parchment noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(100, 85, 60, 0.18) 100%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { display: none; }

    .header { position: fixed; top: 0; left: 0; width: 100%; padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(180deg, rgba(208,199,178,0.95) 0%, transparent 100%); opacity: 0; animation: fadeIn 0.8s ease 0.2s forwards; }
    .logo { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.15em; color: #2a2318; text-decoration: none; transition: all 0.3s ease; }
    .logo:hover { color: #8a7355; }
    .nav-links { display: flex; gap: 20px; }
    .nav-link { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: #5c4a32; text-decoration: none; padding: 8px 16px; border: 1px solid rgba(42,35,24,0.2); border-radius: 4px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
    .nav-link:hover { color: #2a2318; border-color: #5c4a32; background: rgba(92,74,50,0.1); }
    .nav-ham span { display: block; width: 13px; height: 1.5px; background: #5c4a32; margin: 2.5px 0; transition: background 0.3s; }
    .nav-link:hover .nav-ham span { background: #2a2318; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .page-content { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 40px 80px; position: relative; z-index: 1; }

    .connect-container { max-width: 800px; width: 100%; }

    .section-subtitle { font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; color: #5c4a32; margin-bottom: 16px; opacity: 0; animation: slideUp 0.6s ease 0.3s forwards; }
    .section-title { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; color: #2a2318; margin-bottom: 30px; opacity: 0; animation: slideUp 0.6s ease 0.4s forwards; }
    .divider { width: 80px; height: 2px; background: linear-gradient(90deg, #5c4a32, transparent); margin-bottom: 50px; opacity: 0; animation: expandLine 0.8s ease 0.5s forwards; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes expandLine { from { width: 0; opacity: 0; } to { width: 80px; opacity: 1; } }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .social-card {
      background: rgba(42,35,24,0.02);
      border: 1px solid rgba(42,35,24,0.1); border-radius: 10px; padding: 40px 30px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      text-decoration: none; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative; overflow: hidden; opacity: 0; animation: cardIn 0.6s ease forwards;
    }

    .social-card:nth-child(1) { animation-delay: 0.6s; }
    .social-card:nth-child(2) { animation-delay: 0.7s; }
    .social-card:nth-child(3) { animation-delay: 0.8s; }
    .social-card:nth-child(4) { animation-delay: 0.9s; }

    @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .social-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at center, var(--card-glow, rgba(92,74,50,0.08)), transparent);
      opacity: 0; transition: opacity 0.5s ease;
    }

    .social-card:hover::before { opacity: 1; }

    .social-card::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
      background: var(--card-color, linear-gradient(90deg, transparent, #5c4a32, transparent));
      transform: scaleX(0); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-card:hover::after { transform: scaleX(1); }

    .social-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(92,74,50,0.3);
      box-shadow: 0 25px 50px rgba(42,35,24,0.15), 0 0 40px var(--card-shadow, rgba(92,74,50,0.1));
    }

    .social-icon { width: 60px; height: 60px; margin-bottom: 18px; display: block; object-fit: contain; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(20%); }
    .social-card:hover .social-icon { transform: scale(1.15) translateY(-5px); filter: grayscale(0%); }

    .social-name { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 600; color: #2a2318; letter-spacing: 0.05em; margin-bottom: 6px; }
    .social-handle { font-size: 0.85rem; color: #5c4a32; opacity: 0.8; transition: opacity 0.3s ease; }
    .social-card:hover .social-handle { opacity: 1; }

    .social-card.instagram { --card-glow: rgba(225, 48, 108, 0.08); --card-shadow: rgba(225, 48, 108, 0.15); }
    .social-card.youtube { --card-glow: rgba(255, 0, 0, 0.08); --card-shadow: rgba(255, 0, 0, 0.15); }
    .social-card.twitter { --card-glow: rgba(29, 161, 242, 0.08); --card-shadow: rgba(29, 161, 242, 0.15); }
    .social-card.email { --card-glow: rgba(92, 74, 50, 0.08); --card-shadow: rgba(92, 74, 50, 0.15); }

    .connect-quote {
      text-align: center; margin-top: 50px; opacity: 0; animation: slideUp 0.6s ease 1s forwards;
    }

    .connect-quote p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5rem;
      font-weight: 500;
      color: #5c4a32;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .connect-quote .drop-cap {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      line-height: 0.75;
      vertical-align: baseline;
      display: inline-block;
      margin-right: 1px;
      color: #2a2318;
    }

    /* ── Above-grid tagline ── */
    .connect-tagline {
      text-align: center;
      margin-bottom: 36px;
      opacity: 0;
      animation: slideUp 0.6s ease 0.55s forwards;
    }

    .connect-tagline p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5rem;
      font-weight: 500;
      color: #5c4a32;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto;
      letter-spacing: 0.01em;
    }

    .connect-tagline p span.bold { font-weight: 700; color: #2a2318; }

    .connect-tagline .drop-cap {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      line-height: 0.75;
      vertical-align: baseline;
      display: inline-block;
      margin-right: 1px;
      color: #2a2318;
    }

    @media (max-width: 768px) {
      .header { padding: 20px 24px; }
      .nav-links { gap: 10px; }
      .nav-link { padding: 6px 12px; font-size: 0.65rem; }
      .page-content { padding: 100px 24px 60px; }
      .social-grid { grid-template-columns: 1fr; gap: 16px; }
      .social-card { padding: 30px 24px; }
      .section-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="menu.html" class="logo">Ganesh Tajane</a>
    <div class="nav-links">
      <a href="index.html?gallery=1" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">
        Menu
        <div class="nav-ham"><span></span><span></span></div>
      </a>
    </div>
  </header>

  <main class="page-content">
    <div class="connect-container">
      <h1 class="section-title">Connect</h1>
      <div class="divider"></div>

      <!-- Tagline below Connect heading -->
      <div class="connect-tagline">
        <p><span class="drop-cap">E</span>very traveler walks alone <span class="bold">for a while.</span><br>Yet no traveler walks <span class="bold">entirely alone.</span></p>
      </div>

      <div class="social-grid">
        <a href="#" class="social-card instagram" target="_blank">
          <img src="asset/instgram%20logo.png" alt="Instagram" class="social-icon">
          <span class="social-name">Instagram</span>
          <span class="social-handle">@ganeshtajane</span>
        </a>

        <a href="#" class="social-card youtube" target="_blank">
          <img src="asset/youtube%20logo.png" alt="YouTube" class="social-icon">
          <span class="social-name">YouTube</span>
          <span class="social-handle">Ganesh Tajane Channel</span>
        </a>

        <a href="#" class="social-card twitter" target="_blank">
          <img src="asset/tiwtter%20logo.png" alt="Twitter" class="social-icon">
          <span class="social-name">Twitter</span>
          <span class="social-handle">@ganeshtajane</span>
        </a>

        <a href="mailto:contact@ganeshtajane.com" class="social-card email">
          <img src="asset/email%20logo.png" alt="Email" class="social-icon">
          <span class="social-name">Email</span>
          <span class="social-handle">contact@ganeshtajane.com</span>
        </a>
      </div>

      <div class="connect-quote">
        <p><span class="drop-cap">I</span>f these words have found you,<br>perhaps our paths were meant to cross.</p>
      </div>
    </div>
  </main>

  <script>
    // Card tilt
    document.querySelectorAll('.social-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `translateY(-10px) scale(1.02) perspective(1000px) rotateX(${-y * 5}deg) rotateY(${x * 5}deg)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    });
  </script>
  <script>
    // Prevent browser zoom (pinch-to-zoom and keyboard/mousewheel shortcuts)
    (function() {
      // Prevent pinch-to-zoom on touch devices
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap to zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = new Date().getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Prevent Ctrl + Plus / Ctrl + Minus / Ctrl + 0 keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '+' || e.key === '0' || e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 || e.keyCode === 96)) {
          e.preventDefault();
        }
      });

      // Prevent Ctrl + Mouse Wheel zoom
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
</body>
</html>
